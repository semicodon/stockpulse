name: StockPulse Full-Stack CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: NestJS + Prisma E2E & Build
    runs-on: ubuntu-latest

    # Spin up an isolated PostgreSQL 16 service container mapped to port 5433
    services:
      postgres-test:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: stockpulse_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d stockpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    env:
      DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5433/stockpulse_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Deploy versioned SQL migrations to test database
        run: npx prisma migrate deploy

      - name: Build NestJS application
        run: npm run build

      - name: Run isolated E2E test suite
        run: npm run test:e2e -- test/orders.e2e-spec.ts

  frontend-ci:
    name: React + TypeScript Typecheck & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck and build production Vite bundle
        run: npm run build